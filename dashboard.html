<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RanSan Customer Dashboard</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"><style>
body {
  font-family: 'Poppins', sans-serif;
  background: #f4f6fb;
  margin: 0;
  padding: 15px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img { height:50px; }
h2 { color:#6a11cb; }

/* SUMMARY */
.summary-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin:20px 0;
}

.summary-card {
  padding:15px;
  border-radius:10px;
  color:white;
}

.pending { background:#e74c3c; }
.paid { background:#27ae60; }
.total { background:#6a11cb; }

/* PAY ALL */
.pay-all {
  background:#ff7675;
  color:white;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  cursor:pointer;
}

/* GRID */
.invoice-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

/* STATUS */
.overdue {
  border:2px solid red;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity:0.5; }
}

.due-soon { border:2px solid orange; }

.badge {
  padding:4px 10px;
  border-radius:20px;
  color:white;
  font-size:12px;
}

.badge.pending { background:#e74c3c; }
.badge.paid { background:#27ae60; }
.badge.overdue { background:red; }
.badge.due-soon { background:orange; color:black; }

/* BUTTON */
.btn-row { display:flex; gap:10px; }

.btn {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn-pay { background:#27ae60; color:white; }
.btn-download { background:#6a11cb; color:white; }

/* PROGRESS */
.progress {
  background:#eee;
  height:8px;
  border-radius:10px;
  margin-top:5px;
}

.progress-bar {
  height:100%;
  background:linear-gradient(90deg,#00b894,#55efc4);
}

/* OVERDUE TEXT */
.overdue-text {
  color:red;
  font-size:12px;
  font-weight:bold;
}

/* LOADER */
#loader {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  z-index:9999;
}

.spinner {
  width:40px;
  height:40px;
  border:4px solid #ddd;
  border-top:4px solid #6a11cb;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  100% { transform:rotate(360deg); }
}

</style><style id="rs-dark-glass-theme">
/* RanSan dark glass presentation. All application functions remain unchanged. */
:root {
  color-scheme: dark;
  --rs-bg: #080b12;
  --rs-panel: rgba(20, 25, 38, .88);
  --rs-border: rgba(255, 255, 255, .11);
  --rs-text: #f2f5fc;
  --rs-muted: #a5afc3;
  --rs-green: #79edbe;
  --rs-red: #ff9da8;
  --rs-gold: #f5d586;
}
html {
  min-height: 100%;
  background: var(--rs-bg);
}
body {
  max-width: 1280px;
  padding: 28px 24px 0;
  color: var(--rs-text);
  background: transparent;
  font-family: 'Poppins', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 7% 0%, rgba(99, 74, 191, .19), transparent 46%),
    radial-gradient(ellipse at 95% 32%, rgba(27, 131, 128, .10), transparent 48%),
    linear-gradient(155deg, #0c101b, #080b12 66%);
}
h2 { color: var(--rs-text); letter-spacing: -.6px; }
.header {
  padding: 19px 22px;
  gap: 18px;
  border: 1px solid var(--rs-border);
  border-radius: 24px;
  background: rgba(22, 27, 41, .90);
  box-shadow: 0 16px 45px #0003, inset 0 1px 0 #ffffff05;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.logo { flex-shrink: 0; }
.logo img {
  display: block;
  height: 58px;
  width: 58px;
  padding: 5px;
  object-fit: contain;
  border-radius: 15px;
  background: #fff;
  box-shadow: 0 5px 22px #0003;
}
.header > div:nth-child(2) { flex: 1; }
.header h2 { font-size: 24px; font-weight: 600; }
.muted { color: var(--rs-muted); }
#customerName { margin-top: 5px; }
#status {
  display: block;
  padding: 0 4px;
  margin: 17px 0 23px;
  color: var(--rs-muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}
#summary { display: flex; flex-direction: column; gap: 12px; margin-bottom: 27px; }
.summary-grid {
  order: -1;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin: 0 0 3px;
}
.summary-card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  min-height: 150px;
  padding: 24px;
  border: 1px solid var(--rs-border);
  border-radius: 22px;
  background: var(--rs-panel);
  box-shadow: 0 14px 32px #0002, inset 0 1px 0 #ffffff06;
}
.summary-card > div { color: #c5ccdb; font-size: 13px; padding-right: 44px; }
.summary-card strong {
  margin-top: 20px;
  font-size: clamp(22px, 3vw, 34px);
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1.3;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.summary-card::after {
  content: '₹';
  position: absolute;
  top: 20px;
  right: 20px;
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border: 1px solid #ffffff12;
  border-radius: 13px;
  font-size: 19px;
  background: #ffffff08;
}
.summary-card.pending { background: linear-gradient(125deg, #351c2ad9, #151a28 86%); border-color: #ff79882b; }
.summary-card.pending strong, .summary-card.pending::after { color: var(--rs-red); }
.summary-card.paid { background: linear-gradient(125deg, #12332cd9, #151a28 86%); border-color: #68dfb32b; }
.summary-card.paid strong, .summary-card.paid::after { color: var(--rs-green); }
.summary-card.total { background: linear-gradient(125deg, #2b2248d9, #151a28 86%); border-color: #b89bff2b; }
.summary-card.total strong, .summary-card.total::after { color: #c5b4ff; }
.btn {
  min-height: 46px;
  border-radius: 13px;
  border: 1px solid var(--rs-border);
  padding: 12px 16px;
  font: 500 13px 'Poppins', system-ui, sans-serif;
  color: var(--rs-text);
  background: #ffffff09;
  transition: background .18s ease, border-color .18s ease, box-shadow .18s ease;
  touch-action: manipulation;
}
.btn:focus-visible, input:focus-visible {
  outline: 3px solid #d3b7ff;
  outline-offset: 4px;
}
.btn:disabled { opacity: .55; cursor: wait; }
.header-tools .btn { background: #ffffff08; border-color: var(--rs-border); color: #d7ddee; }
.header-tools .btn::before { content: '↻'; margin-right: 8px; font-size: 17px; }
.btn-pay {
  color: #09231b;
  background: linear-gradient(135deg, #9af0ce, #58d6a5);
  border-color: #a1f7d34d;
  box-shadow: 0 5px 20px #55d7a51a;
}
.btn-pay::after { content: ' ↗'; font-size: 16px; }
.btn-download {
  color: #d6c8ff;
  background: linear-gradient(135deg, #6b50a72a, #6b50a714);
  border-color: #b19ad436;
}
.pay-all {
  position: relative;
  width: 100%;
  margin: 0;
  padding: 17px 22px;
  text-align: left;
  color: #c9f7e3;
  border: 1px solid #75deaf3b;
  border-radius: 17px;
  background: linear-gradient(110deg, #1b4632b3, #14251fd9);
  box-shadow: inset 0 1px 0 #ffffff08;
  font-size: 14px;
  overflow-wrap: anywhere;
  padding-right: 52px;
}
.pay-all::after { content: '↗'; position: absolute; right: 22px; top: 14px; font-size: 23px; color: #91e9bd; }
.invoice-grid { gap: 19px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card {
  position: relative;
  padding: 23px;
  border-radius: 23px;
  border: 1px solid var(--rs-border);
  background: linear-gradient(145deg, rgba(26, 32, 47, .94), rgba(16, 21, 32, .96));
  box-shadow: 0 14px 35px #0003, inset 0 1px 0 #ffffff05;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  overflow: hidden;
}
.card-head { align-items: flex-start; gap: 12px; }
.card-head b { font-size: 15px; line-height: 1.6; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.card > .muted { margin: 10px 0; }
.card.overdue { border: 1px solid #ef7c8542; background: linear-gradient(145deg, #30202aeb, #121723 80%); animation: none; }
.card.due-soon { border: 1px solid #e4be6342; background: linear-gradient(145deg, #2e281deb, #121723 80%); }
.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 5px 10px;
  border: 1px solid #ffffff18;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1px;
  min-height: 27px;
  line-height: 1.5;
}
.badge.paid { color: #8debc0; background: #34bd7c1c; border: 1px solid #59d49e30; }
.badge.pending { color: #b9caff; background: #729bff1a; border: 1px solid #729bff33; }
.badge.overdue { color: #ffabb7; background: #fa647b1c; border: 1px solid #fa647b36; animation: none; }
.badge.due-soon { color: #f6d58f; background: #dfad441c; border: 1px solid #dfad4436; }
.badge.cancelled { color: #b8c0ce; background: #9aa5b11a; border: 1px solid #9aa5b136; }
.progress { height: 6px; background: #ffffff0c; border: 1px solid #ffffff05; margin: 13px 0 7px; }
.progress-bar { background: linear-gradient(90deg, #479c91, #7ce6be); box-shadow: 0 0 12px #64dca530; }
.balance-due, .balance-paid { font-size: 24px; letter-spacing: -.6px; font-weight: 600; margin: 14px 0 21px; }
.balance-due { color: #f3d6dd; }
.balance-paid { color: #8debc0; }
.overdue-text { color: #ff9eae; font-weight: 500; font-size: 12px; margin: 9px 0 0; }
.btn-row { gap: 10px; padding-top: 17px; border-top: 1px solid #ffffff0a; }
input { background: #0b111c; border-color: #ffffff26; color: var(--rs-text); min-height: 46px; }
input::placeholder { color: #8490a6; }
#linkHelp h2 { color: var(--rs-text); }
dialog {
  padding: 23px;
  color: var(--rs-text);
  background: #141b29;
  border: 1px solid #ffffff24;
  border-radius: 23px;
  box-shadow: 0 30px 100px #0009;
  max-height: calc(100dvh - 24px);
}
dialog::backdrop { background: #040812cc; backdrop-filter: blur(8px); }
.dialog-tools { gap: 9px; }
#paymentBody h2 { margin: 22px 0 5px; }
#paymentBody > p:not(.muted) { font-size: 27px; font-weight: 600; color: #9aebc7; }
#paymentBody img { display: block; margin: 18px auto; max-width: 100%; height: auto; background: white; padding: 12px; border-radius: 17px; }
#printFrame { border-radius: 10px; background: white; }
#loader { background: #090d17f5; backdrop-filter: blur(12px); }
.spinner { border-color: #ffffff16; border-top-color: #b69bf5; }
footer { margin-top: 34px; border-top: 1px solid #ffffff0b; color: #8c98ae; font-size: 11px; padding: 23px 10px; }
@media (hover: hover) {
  .card:hover { border-color: #ffffff29; }
  .btn-pay:hover { background: linear-gradient(135deg, #b3f7dd, #76e5b7); box-shadow: 0 6px 24px #55d7a530; }
  .btn-download:hover { background: #a78bfa25; border-color: #b19ad466; }
  .pay-all:hover { background: linear-gradient(110deg, #245a40cc, #1b332bd9); border-color: #75deaf66; }
  .header-tools .btn:hover { background: #ffffff12; }
}
@media (max-width: 700px) {
  body { padding: 16px 13px 0; }
  .header { padding: 16px; border-radius: 20px; gap: 12px; }
  .header h2 { font-size: 20px; }
  .header-tools { width: auto; margin-left: auto; }
  .header-tools .btn { font-size: 12px; padding: 10px; }
  .header-tools .btn::before { display: none; }
  .logo img { height: 46px; width: 46px; padding: 4px; border-radius: 12px; }
  .summary-grid { gap: 9px; }
  .summary-card { min-height: 131px; padding: 14px 10px; border-radius: 16px; }
  .summary-card > div { font-size: 11px; padding-right: 0; padding-top: 34px; }
  .summary-card::after { top: 11px; left: 10px; right: auto; width: 27px; height: 27px; font-size: 15px; border-radius: 9px; }
  .summary-card strong { font-size: clamp(15px, 4vw, 23px); letter-spacing: -.5px; margin-top: 10px; }
  .invoice-grid { grid-template-columns: minmax(0, 1fr); gap: 15px; }
  .card { padding: 20px; border-radius: 20px; }
  .pay-all { font-size: 13px; padding-left: 16px; }
  #status { margin: 15px 1px 19px; font-size: 11px; }
  #printDialog { padding: 12px; }
}
@media (max-width: 360px) {
  .header-tools { width: 100%; }
  .header-tools .btn { width: 100%; }
  .summary-card strong { font-size: 14px; }
  .btn-row { flex-direction: column; }
}
@supports not (backdrop-filter: blur(12px)) {
  .header, .card, .summary-card { background-color: #171d2b; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

var RanSanLedger = (function(){'use strict';
const cents=v=>Math.round((Number(v)||0)*100),money=v=>v/100,day=v=>String(v||'').slice(0,10),same=(a,b)=>String(a)===String(b);

function ledger(data,filter={}){const all=events(data,filter),from=filter.from||'',to=filter.to||'9999-12-31';let opening=0;for(const r of all)if(from&&r.date<from)opening+=r.debit-r.credit;let balance=opening,debits=0,credits=0;const rows=[];for(const r of all){if((from&&r.date<from)||r.date>to)continue;balance+=r.debit-r.credit;debits+=r.debit;credits+=r.credit;rows.push({...r,debit:money(r.debit),credit:money(r.credit),balance:money(balance)})}return {from:from,to:to,invalidDates:all.invalidDates||0,opening:money(opening),debits:money(debits),credits:money(credits),closing:money(balance),rows,estimatedDates:rows.filter(r=>r.estimatedDate).length}}

function ageing(data,filter={}){const asOf=filter.to||new Date().toISOString().slice(0,10),totals={'Not due':0,'1–30':0,'31–60':0,'61–90':0,'90+':0,'No due date':0},rows=[];for(const inv of data.invoices||[]){if(filter.customerId&&!same(inv.customerId,filter.customerId)||filter.businessId&&!same(inv.businessId,filter.businessId))continue;const outstanding=invoiceBalance(inv,asOf);if(!outstanding)continue;const due=day(inv.dueDate||inv.due),late=validDate(due)?days(asOf,due):null;const bucket=late===null?'No due date':late<=0?'Not due':late<=30?'1–30':late<=60?'31–60':late<=90?'61–90':'90+';totals[bucket]+=cents(outstanding);rows.push({...inv,outstanding,due,daysOverdue:late,bucket})}for(const k in totals)totals[k]=money(totals[k]);return {rows:rows.sort((a,b)=>(b.daysOverdue||0)-(a.daysOverdue||0)),totals,total:money(rows.reduce((s,r)=>s+cents(r.outstanding),0))}}
function settlements(data,filter={}){const to=filter.to||'9999-12-31',from=filter.from||'';return (data.invoices||[]).filter(inv=>(!filter.businessId||same(inv.businessId,filter.businessId))&&(!filter.customerId||same(inv.customerId,filter.customerId))&&day(inv.date)<=to&&(!from||day(inv.date)>=from)).map(inv=>{const entries=(data.settlements||[]).filter(s=>same(s.invoiceId,inv.id)&&day(s.date)<=to);const earned=cents(inv.commission),received=entries.filter(s=>s.kind==='received').reduce((s,x)=>s+cents(x.amount),0),reversed=entries.filter(s=>s.kind==='reversal').reduce((s,x)=>s+cents(x.amount),0);return {...inv,earned:money(earned),received:money(received),reversed:money(reversed),outstanding:money(earned-received-reversed)}})}

function classification(i){if(/void|cancel/i.test(i.status||''))return {badge:'cancelled',text:'Cancelled',priority:5};if(balance(i)<=0)return {badge:'paid',text:'Paid',priority:4};const d=String(i.dueDate||i.due||'').slice(0,10);if(RanSanLedger.validDate(d)){const diff=Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(today()+'T12:00:00Z'))/86400000);if(diff<0)return {badge:'overdue',text:'Overdue',note:'Overdue by '+(-diff)+' days',priority:1};if(diff<=3)return {badge:'due-soon',text:diff===0?'Due Today':'Due Soon',priority:2}}return {badge:'pending',text:'Pending',priority:3}}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function button(text,fn,cls){const b=node('button',text,'btn '+(cls||''));b.type='button';b.onclick=fn;return b}
function business(i){return (portalData.businesses||[]).find(b=>String(b.id)===String(i.businessId))||{}}
function upi(b,amount,reference){return 'upi://pay?'+new URLSearchParams({pa:b.upi,pn:b.name||'RanSan',am:amount.toFixed(2),cu:'INR',tn:reference||'Invoice Payment'}).toString()}
function renderDashboard(data){
 portalData=data;allInvoices=data.invoices||[];window.allInvoices=allInvoices;window.allCustomers=data.customers||[data.customer];
 $('customerName').textContent=data.customer.name||'Customer';$('content').hidden=false;$('linkHelp').hidden=true;
 const invoices=allInvoices.slice().sort((a,b)=>classification(a).priority-classification(b).priority);let total=0,paid=0,pending=0;const groups=new Map(),grid=node('div',undefined,'invoice-grid');
 for(const inv of invoices){const status=classification(inv),t=Number(inv.total)||0,bal=balance(inv),p=Math.max(0,t-bal),biz=business(inv);if(status.badge!=='cancelled'){total+=t;paid+=p;pending+=bal}
 const card=node('article',undefined,'card '+(status.badge==='overdue'||status.badge==='due-soon'?status.badge:'')),head=node('div',undefined,'card-head');head.append(node('b',invoiceNo(inv)),node('span',status.text,'badge '+status.badge));card.append(head,node('p',biz.name||'RanSan','muted'),node('div',money(p)+' / '+money(t),'muted'));
 const progress=node('div',undefined,'progress'),bar=node('div',undefined,'progress-bar');bar.style.width=Math.max(0,Math.min(100,t?p/t*100:0))+'%';progress.append(bar);card.append(progress);
 card.append(node('p','Invoice: '+String(inv.date||'').slice(0,10)+' · Due: '+String(inv.dueDate||inv.due||'Not set').slice(0,10),'muted'));if(status.note)card.append(node('p',status.note,'overdue-text'));
 card.append(node('p',status.badge==='cancelled'?'Cancelled':bal>0?money(bal)+' due':'Paid',bal>0?'balance-due':'balance-paid'));
 const actions=node('div',undefined,'btn-row');if(bal>0&&biz.upi){actions.append(button('Pay Now',()=>payNow(upi(biz,bal,invoiceNo(inv)),bal),'btn-pay'));const key=String(biz.id);if(!groups.has(key))groups.set(key,{biz,amount:0});groups.get(key).amount+=bal}else if(bal>0)card.append(node('p','Contact RanSan for payment details.','muted'));
 actions.append(button('Download / PDF',()=>openPrintById(inv.id),'btn-download'));card.append(actions);grid.append(card)}
 $('invoices').replaceChildren(grid);if(!invoices.length)$('invoices').append(node('p','No invoices available.','card'));
 const summary=node('div',undefined,'summary-grid');for(const [label,value,cls]of [['To Pay',pending,'pending'],['Paid',paid,'paid'],['Total',total,'total']]){const card=node('div',undefined,'summary-card '+cls);card.append(node('div',label),node('strong',money(value)));summary.append(card)}$('summary').replaceChildren();for(const {biz,amount} of groups.values()){const label=groups.size===1?'Pay All '+money(amount):'Pay '+(biz.name||'business')+' · '+money(amount);$('summary').append(button(label,()=>payNow(upi(biz,amount,'Invoice payments'),amount),'pay-all'))}$('summary').append(summary);
 $('status').textContent='Updated '+new Date().toLocaleTimeString()+' · Link expires '+new Date(data.expires).toLocaleDateString();
}
async function loadData(){if(busy)return;if(!portalToken){$('loader').hidden=true;$('status').textContent='Open the protected customer link shared by RanSan.';$('linkHelp').hidden=false;return}if(!['test','live'].includes(ENV)){$('loader').hidden=true;$('status').textContent='Invalid environment in link.';return}busy=true;$('retry').disabled=true;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);
 try{const res=await fetch(API_URL+'?action=portaldata&env='+ENV,{method:'POST',body:JSON.stringify({portalToken}),credentials:'omit',signal:controller.signal});let data;try{data=await res.json()}catch(e){throw Error('Backend did not return JSON. Check the Apps Script deployment.')}if(!res.ok||data.error||data.success===false)throw Error(data.error||'Unable to load dashboard.');if(!data.customer||!Array.isArray(data.invoices)||!Array.isArray(data.businesses))throw Error('Deploy the corrected v8 backend and create a new customer link.');renderDashboard(data);isFirstLoad=false}
 catch(e){$('status').textContent=(e.name==='AbortError'?'Connection timed out. Please retry.':e.message)+(portalData?' · Showing previously loaded data.':'');if(/expired|revoked/i.test(e.message)){portalToken=null;storage.remove('rs-classic-token:'+ENV);portalData=null;allInvoices=[];window.allInvoices=[];window.allCustomers=[];$('content').hidden=true;$('summary').replaceChildren();$('invoices').replaceChildren();$('printDialog').close();$('printFrame').srcdoc='';$('linkHelp').hidden=false}}
 finally{clearTimeout(timer);busy=false;$('loader').hidden=true;$('retry').disabled=false}
}
function payNow(link,amount){if(!/^upi:\/\/pay\?/.test(link)||!(Number(amount)>0))return;if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href=link;return}const box=$('paymentBody');box.replaceChildren(node('h2','Scan & Pay'),node('p',money(amount)));const img=node('img');img.alt='UPI payment QR code';img.width=220;img.height=220;img.src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(link);box.append(img,node('p','Scan using your UPI app. Payment confirmation appears after RanSan records it.','muted'));$('paymentDialog').showModal()}
function escapeHTML(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safePrintFields(value){if(typeof value==='string')return escapeHTML(value);if(Array.isArray(value))return value.map(safePrintFields);if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,safePrintFields(v)]));return value}
function preparePrint(input){const id=typeof input==='object'&&input?input.id:input,source=allInvoices.find(x=>String(x.id)===String(id));if(!source){alert('Invoice not found');return null}const inv=JSON.parse(JSON.stringify(source));inv.business=business(source);inv.customer=portalData.customer;inv.items=inv.items||[];inv.total=Number(inv.total)||0;inv.payments=(inv.payments||[]).map(p=>({...p,amount:Number(p.amount)||0}));return inv}

loadData();setInterval(()=>{if(portalToken&&!document.hidden)loadData()},30000);

function openPrintById(invId) {

  const inv = (window.allInvoices || []).find(x => String(x.id) === String(invId));

  if (!inv) {
    alert("Invoice not found");
    console.log("Invoice ID:", invId);
    return;
  }

  openPrint(inv);
}
  
function openPrint(input) {

  let inv = preparePrint(input);
  if (!inv) return;
  // safety
  inv.items = inv.items || [];
  inv.payments = inv.payments || [];

  if (!inv) return;

let cust = {
  name: "-",
  phone: "-",
  email: "-"
};

// ✅ 1. Direct fields (most common)
if (inv.customerName || inv.customerPhone || inv.customerEmail) {
  cust = {
    name: inv.customerName || inv.customer_name || "-",
    phone: inv.customerPhone || inv.customer_phone || "-",
    email: inv.customerEmail || inv.customer_email || "-"
  };
}

// ✅ 2. Nested object (snapshot style)
if (inv.customer) {
  cust = {
    name: inv.customer.name || cust.name,
    phone: inv.customer.phone || cust.phone,
    email: inv.customer.email || cust.email
  };
}

// ✅ 3. From global customers (fallback)
if ((cust.name === "-" || cust.phone === "-") && window.allCustomers) {
  const c = window.allCustomers.find(x => x.id === inv.customerId);

  if (c) {
    cust = {
      name: c.name || cust.name,
      phone: c.phone || cust.phone,
      email: c.email || cust.email
    };
  }
}
