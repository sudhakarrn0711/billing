<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RanSan — Customer portal</title><script src="assets/app-config.js" defer></script><script src="assets/api-client.js" defer></script><script src="assets/ledger-core.js" defer></script><script src="assets/modern.js" defer></script><script src="assets/portal.js" defer></script><link rel="stylesheet" href="assets/modern.css"><style>body{padding:20px!important;max-width:1200px;margin:auto!important;color:#edf2fa}header.portal-header{position:static!important;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:18px}.portal-brand{display:flex;align-items:center;gap:14px}.portal-brand img{width:42px;height:52px;object-fit:contain}h1{font-size:23px;margin:4px 0}h2{font-size:19px}.portal-muted{color:#a7b2c4;font-size:12px}.portal-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.portal-cards>div{padding:18px;border:1px solid #ffffff20;border-radius:16px;background:#141c2a}.portal-cards span{font-size:12px;color:#a7b2c4}.portal-cards strong{font-size:23px;display:block;margin-top:7px}.portal-section{padding:20px;margin:16px 0}.portal-scroll{overflow:auto}table{min-width:650px;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #ffffff15;font-size:13px}.portal-filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.portal-filters label{font-size:12px;color:#a7b2c4}.portal-filters input{display:block;margin-top:5px}.portal-actions{display:flex;gap:8px;flex-wrap:wrap}.portal-actions button{padding:8px 12px}#portalStatus{padding:20px;line-height:1.6;color:#c7d2fe}footer{padding:20px;text-align:center;color:#a7b2c4;font-size:12px}@media(max-width:600px){body{padding:12px!important}.portal-cards{gap:7px}.portal-cards>div{padding:12px}.portal-cards strong{font-size:17px}.portal-section{padding:12px}.portal-header h1{font-size:18px}}</style></head><body><header class="portal-header glass"><div class="portal-brand"><img src="assets/ransan_logo.png" alt="RanSan"><div><p class="portal-muted">CUSTOMER PORTAL</p><h1 id="portalCustomer">Your billing overview</h1></div></div><button id="portalExit" class="btn" type="button">Close session</button></header><p id="portalStatus" role="status">Checking your protected link…</p><main id="portalMain" hidden><div id="portalCards" class="portal-cards"></div><section class="portal-section glass"><h2>Invoices</h2><div class="portal-scroll"><table><thead><tr><th>Invoice</th><th>Date</th><th>Business</th><th>Total</th><th>Outstanding</th><th>Actions</th></tr></thead><tbody id="portalInvoices"></tbody></table></div></section><section class="portal-section glass"><h2>Customer statement</h2><div class="portal-filters"><label>From<input id="portalFrom" type="date"></label><label>Through<input id="portalTo" type="date"></label><button type="button" id="portalApply" class="btn">Apply</button><button type="button" id="portalPrintStatement" class="btn">Print / PDF</button></div><p id="portalLedgerSummary" class="portal-muted"></p><div class="portal-scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody id="portalLedger"></tbody></table></div></section></main><footer>© 2026 RanSan Technology · Protected customer access</footer></body></html>
