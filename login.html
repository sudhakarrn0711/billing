<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RanSan — Sign in</title><script src="assets/app-config.js" defer></script><script src="assets/api-client.js" defer></script><script src="assets/login.js" defer></script><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#25204d,#080d18 65%);color:#eef2ff;font:15px system-ui;padding:20px}.card{width:min(440px,100%);padding:32px;border:1px solid #ffffff24;background:#141c2bdd;border-radius:24px;box-shadow:0 24px 80px #0005}.brand{display:flex;align-items:center;gap:16px}.brand img{width:48px;height:58px;object-fit:contain}h1{font-size:25px;margin:6px 0}.muted{color:#a8b7cf;font-size:13px;line-height:1.6}label{display:block;margin-top:18px;font-size:13px}input,select,button{width:100%;padding:13px;border-radius:12px;background:#0b1220;color:#eef2ff;border:1px solid #ffffff30;font:inherit;margin-top:7px;min-height:46px}button{background:#6366f1;border:0;margin-top:24px;cursor:pointer;font-weight:650}button:disabled{opacity:.6}#loginStatus{min-height:40px;margin-top:16px;color:#fecdd3;line-height:1.5;font-size:13px}:focus-visible{outline:2px solid #a5b4fc;outline-offset:3px}</style></head><body><main class="card"><div class="brand"><img src="assets/ransan_logo.png" alt="RanSan"><div><span class="muted">RANSAN WORKSPACE</span><h1>Welcome back</h1></div></div><p class="muted">Sign in to your billing workspace. Sessions are verified by your Apps Script backend.</p><form id="rsLoginForm"><label for="loginEnv">Environment<select id="loginEnv"><option value="test">TEST workspace</option><option value="live">LIVE workspace</option></select></label><label for="loginName">Username<input id="loginName" autocomplete="username" required maxlength="80"></label><label for="loginPassword">Password<input id="loginPassword" type="password" autocomplete="current-password" r
